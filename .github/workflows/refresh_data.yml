name: Daily Data Refresh

on:
  schedule:
    # GitHub Actions free-tier cron has no execution-time guarantee - commit
    # history showed the old 11:00 UTC trigger actually completing anywhere
    # from 15:00 to 20:39 UTC (a 4-9.5h delay), landing mid-trading-day
    # instead of before market open. 02:23 UTC is ~9-10pm US Eastern the
    # evening the session just closed (well after Tiingo's EOD data settles,
    # comfortably before the next day's ~13:30-14:30 UTC market open even
    # with a similar multi-hour delay), and :23 avoids the top-of-hour
    # congestion GitHub's docs cite as a common delay cause.
    #
    # Because 02:23 UTC falls before the ~04:00-05:00 UTC US-midnight
    # threshold, it's still the *previous* US calendar evening - so this
    # triggers Tue-Sat UTC (not Mon-Fri) to correctly capture Mon-Fri US
    # trading sessions: "Tuesday 02:23 UTC" = "Monday evening ET", etc.
    - cron: "23 2 * * 2-6"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers to debug (e.g. NVDA). Leave blank for all watchlists - blank runs are the only ones that update results/*.json."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh job
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TICKERS_OVERRIDE: ${{ github.event.inputs.tickers }}
        run: python scripts/refresh_job.py

      - name: Commit and push results
        if: ${{ github.event.inputs.tickers == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "[data] daily refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
