name: Daily Data Refresh

on:
  schedule:
    # 11:00 UTC ~= 6-7am US Eastern depending on DST - overnight run, after EOD data
    # has fully settled, ready before market open. Weekdays only.
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh job
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python scripts/refresh_job.py

      - name: Commit and push results.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "[data] daily refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
