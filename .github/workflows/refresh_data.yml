name: Daily Data Refresh

on:
  schedule:
    # GitHub Actions free-tier cron has no execution-time guarantee - commit
    # history showed the old single nightly trigger completing anywhere from
    # 4-9.5h late. Tiingo's free tier caps requests at ~50/hour and the
    # unique-ticker count across all watchlists now exceeds that, so
    # refresh_job.py drains a persisted queue ~45 tickers per invocation
    # instead of fetching everyone in one pass - this fires every hour, all
    # day, so however many batches a night's queue needs, it gets them
    # without waiting on a bounded window (and without manual re-triggering
    # if a day's firings land late or get skipped). Firings after the queue
    # drains are fast no-ops. This repo is public, so GitHub-hosted Actions
    # minutes are unmetered - 24 firings/day costs nothing extra over a
    # narrower window; this would need revisiting if the repo ever goes
    # private again. :23 avoids the top-of-hour congestion GitHub's docs
    # cite as a common delay cause.
    #
    # Tue-Sat UTC (not Mon-Fri) because, e.g., "Tuesday 02:23 UTC" is still
    # Monday evening US Eastern - this captures Mon-Fri US trading sessions
    # correctly despite the UTC/US-calendar-day offset.
    - cron: "23 * * * 2-6"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers to debug (e.g. NVDA). Leave blank for all watchlists - blank runs are the only ones that update results/*.json."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # The hourly firings above all read-modify-write the same state/refresh_queue.json,
  # so a delayed firing overlapping the next one must be queued, not run in parallel -
  # otherwise two runs could pop the same batch twice or race on the commit.
  group: refresh-queue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh job
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TICKERS_OVERRIDE: ${{ github.event.inputs.tickers }}
        run: python scripts/refresh_job.py

      - name: Commit and push results
        if: ${{ github.event.inputs.tickers == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ state/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "[data] daily refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
